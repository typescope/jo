name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'tools/vscode/syntaxes/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Served at /stdlib/<version>/ — docs/public is copied to the site root
      # verbatim. Bundles come from release assets, so releases without one are
      # skipped rather than failing the build.
      - name: Fetch published stdlib API docs
        run: .github/scripts/fetch-stdlib-docs.sh

      - name: Install dependencies
        run: npm --prefix docs install

      - name: Build docs and check links
        run: npm --prefix docs run build

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
