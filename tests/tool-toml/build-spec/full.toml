jo = "1.0"
default = "app"

[pinning]
mustache = "1.2.3"

[module.app]
kind = "app"
src = ["src/", "vendor/"]
resources = ["assets/", "public/logo.svg:logo.svg"]
platform = "python"
depth = 2
compile-options = ["--fatal-warnings"]
doc-options = ["--title", "My App API", "--include-private"]

modules = [
  { id = "utils", path = "../utils" },
  { id = "agent-runtime", path = "../runtime", link = true },
]
packages = [{ name = "http", version = "1.0" }]

links = [
  { from = "MyApp.Iface.run", to = "MyApp.Impl.run" },
]

[module.test]
kind = "app"
platform = "python"
src = ["tests/"]
depth = 3

modules = [
  "app",
  { id = "testlib", path = "../testlib" },
]
