jo = "1.0"
default = "app"

# `app` reaches `shared-pkg` two ways: directly as a Check package dep, and indirectly
# through `b`'s own Check package dep on it, exposed to `app` only via `b`'s Link edge.
# `shared-pkg` must end up on the check path (--lib) exactly once, never also demoted to
# a hidden link lib (--link-lib) for `b`.
[module.b]
kind = "lib"
src = ["b/"]

packages = [{ name = "shared-pkg", version = "1.0" }]

[module.app]
kind = "app"
platform = "python"
src = ["app/"]

modules = [{ id = "b", link = true }]
packages = [{ name = "shared-pkg", version = "1.0" }]
