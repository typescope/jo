jo = "0.14"

[module.api]
kind = "lib"
platform = "pure"
src = ["DatabaseAPI.jo"]

[module.runtime]
kind = "lib"
platform = "python"
enable-ffi = true
src = ["runtime/"]
modules = ["api"]

[module.guest]
kind = "app"
platform = "python"
src = ["Task.jo"]
modules = ["api", { id = "runtime", link = true }]

links = [
  { from = "jo.main", to = "docs.runtime.platformMain" },
  { from = "docs.api.main", to = "docs.task.main" },
]
