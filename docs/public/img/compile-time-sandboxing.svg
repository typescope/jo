<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -68 872 482" role="img" aria-label="No ambient authority. A confined function with no ambient authority: reflection, globals, network, files, type casts, and control effects are all rejected by the compiler, while the function's typed parameters are the only allowed door to the outside world.">
  <style>
    /* Transparent background. Colours follow the reader's light or dark preference. */
    @media (prefers-color-scheme: dark) {
      [fill="#0a7f7f"] { fill: #2dd4bf; }
      [fill="#64748b"] { fill: #94A3B8; }
      [fill="#0f1720"] { fill: #E8EFF6; }
      [fill="#b8322a"] { fill: #f87171; }
      [fill="#7b8a9a"] { fill: #5E7A93; }
      [fill="#ffffff"] { fill: #172030; }
      [fill="#b45309"] { fill: #f59e0b; }
      [stroke="#0a7f7f"] { stroke: #2dd4bf; }
      [stroke="#cbd5e1"] { stroke: #243447; }
      [stroke="#b8322a"] { stroke: #f87171; }
      [stroke="#9fb3c4"] { stroke: #3A5570; }
      [stroke="#d97706"] { stroke: #f59e0b; }
    }
  </style>

  <!-- Title -->
  <text x="436" y="-40" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="21" font-weight="600" fill="#0f1720">No Ambient Authority</text>
  <line x1="346" y1="-20" x2="526" y2="-20" stroke="#cbd5e1" stroke-width="1"/>

  <defs>
    <marker id="cts-arrow-green" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M12,6 L0,0 L4,6 L0,12 z" fill="#0a7f7f"/>
    </marker>
    <marker id="cts-arrow-red" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M12,6 L0,0 L4,6 L0,12 z" fill="#b8322a"/>
    </marker>
  </defs>

  <!-- ===== Blocked doors (left) ===== -->
  <!-- labels -->
  <text x="135" y="50"  text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#b8322a">reflection</text>
  <text x="62"  y="122" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#b8322a">globals</text>
  <text x="45"  y="195" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#b8322a">network</text>
  <text x="45"  y="253" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#b8322a">files</text>
  <text x="60"  y="325" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#b8322a">type cast</text>
  <text x="135" y="398" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#b8322a">control effects</text>

  <!-- rejected paths radiating from the function, each crossed out -->
  <g stroke="#b8322a" stroke-width="1.4" stroke-opacity="0.7" stroke-dasharray="5 4" marker-end="url(#cts-arrow-red)">
    <line x1="215" y1="180" x2="156" y2="81"/>
    <line x1="200" y1="195" x2="122" y2="150"/>
    <line x1="200" y1="210" x2="119" y2="202"/>
    <line x1="200" y1="230" x2="124" y2="240"/>
    <line x1="200" y1="245" x2="126" y2="286"/>
    <line x1="215" y1="260" x2="165" y2="344"/>
  </g>
  <!-- bold red crosses marking the rejection -->
  <g stroke="#b8322a" stroke-width="2.6" stroke-linecap="round">
    <g transform="translate(150,71)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(112,144)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(107,201)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(112,242)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(116,292)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(159,354)"><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
  </g>

  <!-- ===== Confined function (center) ===== -->
  <text x="600" y="170" text-anchor="end" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#b45309">Confined function</text>
  <rect x="200" y="180" width="400" height="84" rx="8" fill="#f59e0b" fill-opacity="0.1" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="220" y="214" font-family="'IBM Plex Mono', monospace" font-size="14.5">
    <tspan fill="#0a7f7f">def</tspan><tspan fill="#0f1720"> work(sales: </tspan><tspan fill="#0a7f7f">Sales</tspan><tspan fill="#0f1720">, mailer: </tspan><tspan fill="#0a7f7f">Mailer</tspan><tspan fill="#0f1720">) </tspan><tspan fill="#64748b">=</tspan>
  </text>
  <text x="244" y="240" font-family="'IBM Plex Mono', monospace" font-size="14.5" fill="#7b8a9a">...</text>

  <!-- ===== Allowed capabilities (right) ===== -->
  <!-- green flows: parameters are the only open door -->
  <path d="M600,210 C642,186 664,158 690,151" fill="none" stroke="#0a7f7f" stroke-width="2" marker-end="url(#cts-arrow-green)"/>
  <path d="M600,234 C642,256 664,286 690,291" fill="none" stroke="#0a7f7f" stroke-width="2" marker-end="url(#cts-arrow-green)"/>

  <!-- Sales capability box -->
  <rect x="698" y="118" width="160" height="68" rx="6" fill="#ffffff" stroke="#9fb3c4" stroke-width="1.4"/>
  <rect x="694" y="138" width="8" height="8" fill="#7b8a9a"/>
  <rect x="694" y="160" width="8" height="8" fill="#7b8a9a"/>
  <text x="778" y="148" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#0a7f7f">interface</text>
  <text x="778" y="170" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="15" fill="#0f1720">Sales</text>

  <!-- Mailer capability box -->
  <rect x="698" y="258" width="160" height="68" rx="6" fill="#ffffff" stroke="#9fb3c4" stroke-width="1.4"/>
  <rect x="694" y="278" width="8" height="8" fill="#7b8a9a"/>
  <rect x="694" y="300" width="8" height="8" fill="#7b8a9a"/>
  <text x="778" y="288" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#0a7f7f">interface</text>
  <text x="778" y="310" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="15" fill="#0f1720">Mailer</text>
</svg>
