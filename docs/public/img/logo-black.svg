<svg
  width="128"
  height="128"
  viewBox="0 0 128 128"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Transparent background -->
  <rect width="128" height="128" fill="none"/>

  <!-- Capital J: stem from the cap line down to the baseline at y=100 -->
  <path
    d="M37 28 V82 C37 94 29 100 21 100"
    fill="none"
    stroke="#222222"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Lowercase o: x-height is 70% of the cap height, sitting on the same
       baseline as the J -->
  <circle
    cx="84"
    cy="77"
    r="23"
    fill="none"
    stroke="#222222"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Accent dot in the counter of the o -->
  <circle
    cx="84"
    cy="77"
    r="6.4"
    fill="#222222"
  />
</svg>
