<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
  <title id="title">Integrating Jo with an agent framework</title>
  <desc id="description">The agent sends Jo source to one tool. The tool compiles it against a confined API, links a trusted API implementation, runs the program, and returns its output or runtime error to the agent. Compiler errors go back to the agent from the check step.</desc>

  <style>
    :root {
      color-scheme: light dark;
      --surface: #f6f6f7;
      --surface-inset: #ffffff;
      --border: #e2e2e3;
      --border-strong: #b8b8bd;
      --text: #3c3c43;
      --text-muted: #67676c;
      --arrow: #85858e;
      --green: #047857;
      --green-surface: #ecfdf5;
      --green-border: #6ee7b7;
      --amber: #92400e;
      --amber-surface: #fffbeb;
      --amber-border: #d6a34b;
      --teal: #0e7490;
      --teal-surface: #ecfeff;
      --teal-border: #67c9d5;
      --badge-text: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #202127;
        --surface-inset: #1b1b1f;
        --border: #2e2e32;
        --border-strong: #56565e;
        --text: #dfdfd6;
        --text-muted: #b0b0b8;
        --arrow: #98989f;
        --green: #34d399;
        --green-surface: #182c26;
        --green-border: #29654f;
        --amber: #fbbf24;
        --amber-surface: #30291c;
        --amber-border: #8a6b2f;
        --teal: #22d3ee;
        --teal-surface: #192b30;
        --teal-border: #2c6773;
        --badge-text: #1b1b1f;
      }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--arrow)"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--amber)"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--green)"/>
    </marker>
  </defs>

  <rect x="30" y="125" width="160" height="120" rx="14" fill="var(--green-surface)" stroke="var(--green-border)" stroke-width="2"/>
  <text x="110" y="181" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="var(--text)">Agent</text>
  <text x="110" y="207" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="var(--text-muted)">model + tool loop</text>

  <rect x="279" y="33" width="640" height="325" rx="17" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="304" y="73" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="var(--text)">One tool: <tspan fill="var(--green)">run_jo_program(source)</tspan></text>
  <line x1="304" y1="93" x2="894" y2="93" stroke="var(--border)"/>

  <rect x="292" y="103" width="420" height="238" rx="14" fill="var(--surface-inset)" stroke="var(--border-strong)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="308" y="125" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="var(--text)">Compile</text>

  <rect x="308" y="135" width="180" height="100" rx="12" fill="var(--amber-surface)" stroke="var(--amber-border)" stroke-width="1.8"/>
  <circle cx="339" cy="168" r="16" fill="var(--amber)"/>
  <text x="339" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="var(--badge-text)">1</text>
  <text x="366" y="176" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--amber)">Check</text>
  <text x="326" y="211" font-family="system-ui, sans-serif" font-size="14" fill="var(--text-muted)">check the Jo program</text>

  <rect x="516" y="135" width="180" height="100" rx="12" fill="var(--green-surface)" stroke="var(--green-border)" stroke-width="1.8"/>
  <circle cx="547" cy="168" r="16" fill="var(--green)"/>
  <text x="547" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="var(--badge-text)">2</text>
  <text x="574" y="176" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--green)">Link</text>
  <text x="534" y="211" font-family="system-ui, sans-serif" font-size="14" fill="var(--text-muted)">attach trusted code</text>

  <rect x="734" y="135" width="170" height="100" rx="12" fill="var(--teal-surface)" stroke="var(--teal-border)" stroke-width="1.8"/>
  <circle cx="765" cy="168" r="16" fill="var(--teal)"/>
  <text x="765" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="var(--badge-text)">3</text>
  <text x="792" y="176" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="var(--teal)">Run</text>
  <text x="750" y="211" font-family="system-ui, sans-serif" font-size="14" fill="var(--text-muted)">execute the program</text>

  <rect x="308" y="268" width="180" height="58" rx="10" fill="var(--amber-surface)" stroke="var(--amber-border)" stroke-width="1.3"/>
  <text x="398" y="303" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--amber)">Confined API</text>

  <rect x="516" y="268" width="180" height="58" rx="10" fill="var(--green-surface)" stroke="var(--green-border)" stroke-width="1.3"/>
  <text x="606" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--green)">Trusted API</text>
  <text x="606" y="313" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="var(--green)">implementation</text>

  <path d="M190 170 H306" fill="none" stroke="var(--arrow)" stroke-width="2.3" marker-end="url(#arrow)"/>
  <text x="242" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="var(--text-muted)">Jo source</text>
  <path d="M308 204 H192" fill="none" stroke="var(--arrow)" stroke-width="2.3" marker-end="url(#arrow)"/>
  <text x="242" y="223" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="var(--text-muted)">compiler error</text>
  <path d="M488 185 H514" fill="none" stroke="var(--arrow)" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M696 185 H732" fill="none" stroke="var(--arrow)" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M398 268 V237" fill="none" stroke="var(--amber)" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M606 268 V237" fill="none" stroke="var(--green)" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <path d="M819 235 V401 H110 V247" fill="none" stroke="var(--arrow)" stroke-width="2.3" marker-end="url(#arrow)"/>
  <text x="464" y="389" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="var(--text-muted)">output or runtime error</text>
</svg>
