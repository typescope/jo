<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
  <title id="title">Integrating Jo with an agent framework</title>
  <desc id="description">The agent sends Jo source to one tool. The tool compiles it against a confined API, runs the compiled program with trusted capabilities, and returns output or an error to the agent.</desc>

  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop offset="0" stop-color="#142438"/>
      <stop offset="1" stop-color="#0B1421"/>
    </linearGradient>
    <linearGradient id="agent-surface" x2="0" y2="1">
      <stop offset="0" stop-color="#203451"/>
      <stop offset="1" stop-color="#15253C"/>
    </linearGradient>
    <linearGradient id="tool-surface" x2="0" y2="1">
      <stop offset="0" stop-color="#172B3A"/>
      <stop offset="1" stop-color="#101D2C"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A3B9C9"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F4C26B"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3DD4BD"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="438" rx="20" fill="url(#background)" stroke="#3A5268" stroke-width="2"/>

  <rect x="30" y="93" width="216" height="205" rx="14" fill="url(#agent-surface)" stroke="#668DBB" stroke-width="2"/>
  <text x="138" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#F2F7FC">Agent framework</text>
  <text x="138" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#B9CAE0">model + tool loop</text>

  <rect x="287" y="33" width="640" height="325" rx="17" fill="url(#tool-surface)" stroke="#668299" stroke-width="2"/>
  <text x="312" y="73" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#F2F7FC">One tool: <tspan fill="#53DDC4">run_jo_program(source)</tspan></text>
  <line x1="312" y1="93" x2="902" y2="93" stroke="#31485A"/>

  <rect x="312" y="122" width="270" height="112" rx="12" fill="#2C251B" stroke="#D3A058" stroke-width="1.8"/>
  <circle cx="343" cy="158" r="16" fill="#F4C26B"/>
  <text x="343" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#292016">1</text>
  <text x="372" y="166" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFDA96">Compile</text>
  <text x="332" y="202" font-family="system-ui, sans-serif" font-size="14" fill="#E4D3B3">check the Jo program</text>

  <rect x="632" y="122" width="270" height="112" rx="12" fill="#12302B" stroke="#2EAE9B" stroke-width="1.8"/>
  <circle cx="663" cy="158" r="16" fill="#3DD4BD"/>
  <text x="663" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0D2824">2</text>
  <text x="692" y="166" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#78EBD7">Run</text>
  <text x="652" y="202" font-family="system-ui, sans-serif" font-size="14" fill="#BCE6DD">execute the compiled program</text>

  <rect x="312" y="265" width="270" height="61" rx="10" fill="#251F19" stroke="#94754D" stroke-width="1.3"/>
  <text x="447" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#F4C26B">Confined API</text>

  <rect x="632" y="265" width="270" height="61" rx="10" fill="#112923" stroke="#287F73" stroke-width="1.3"/>
  <text x="767" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#53DDC4">Trusted capabilities</text>

  <path d="M246 183 H310" fill="none" stroke="#A3B9C9" stroke-width="2.3" marker-end="url(#arrow)"/>
  <text x="278" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#C1D2E0">Jo source</text>
  <path d="M582 183 H630" fill="none" stroke="#A3B9C9" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M447 265 V236" fill="none" stroke="#F4C26B" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M767 265 V236" fill="none" stroke="#3DD4BD" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <path d="M927 242 H942 V401 H138 V300" fill="none" stroke="#A3B9C9" stroke-width="2.3" marker-end="url(#arrow)"/>
  <text x="538" y="389" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#C1D2E0">output or compiler error</text>
</svg>
