<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
  <title id="title">Integrating Jo with an agent framework</title>
  <desc id="description">The agent sends Jo source to one tool. The tool compiles it against a confined API, links a trusted API implementation, runs the program, and returns its output or runtime error to the agent. Compiler errors go back to the agent from the check step.</desc>

  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop offset="0" stop-color="#142438"/>
      <stop offset="1" stop-color="#0B1421"/>
    </linearGradient>
    <linearGradient id="agent-surface" x2="0" y2="1">
      <stop offset="0" stop-color="#203451"/>
      <stop offset="1" stop-color="#15253C"/>
    </linearGradient>
    <linearGradient id="tool-surface" x2="0" y2="1">
      <stop offset="0" stop-color="#172B3A"/>
      <stop offset="1" stop-color="#101D2C"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A3B9C9"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F4C26B"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3DD4BD"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="438" rx="20" fill="url(#background)" stroke="#3A5268" stroke-width="2"/>

  <rect x="30" y="125" width="160" height="120" rx="14" fill="url(#agent-surface)" stroke="#668DBB" stroke-width="2"/>
  <text x="110" y="181" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#F2F7FC">Agent</text>
  <text x="110" y="207" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#B9CAE0">model + tool loop</text>

  <rect x="279" y="33" width="640" height="325" rx="17" fill="url(#tool-surface)" stroke="#668299" stroke-width="2"/>
  <text x="304" y="73" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#F2F7FC">One tool: <tspan fill="#53DDC4">run_jo_program(source)</tspan></text>
  <line x1="304" y1="93" x2="894" y2="93" stroke="#31485A"/>

  <rect x="292" y="103" width="420" height="238" rx="14" fill="#0E1A27" stroke="#4A6378" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="308" y="125" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#D5E2EE">Compile</text>

  <rect x="308" y="135" width="180" height="100" rx="12" fill="#2C251B" stroke="#D3A058" stroke-width="1.8"/>
  <circle cx="339" cy="168" r="16" fill="#F4C26B"/>
  <text x="339" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#292016">1</text>
  <text x="366" y="176" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFDA96">Check</text>
  <text x="326" y="211" font-family="system-ui, sans-serif" font-size="14" fill="#E4D3B3">check the Jo program</text>

  <rect x="516" y="135" width="180" height="100" rx="12" fill="#12302B" stroke="#2EAE9B" stroke-width="1.8"/>
  <circle cx="547" cy="168" r="16" fill="#3DD4BD"/>
  <text x="547" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0D2824">2</text>
  <text x="574" y="176" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#78EBD7">Link</text>
  <text x="534" y="211" font-family="system-ui, sans-serif" font-size="14" fill="#BCE6DD">attach trusted code</text>

  <rect x="734" y="135" width="170" height="100" rx="12" fill="#1A2A44" stroke="#668DBB" stroke-width="1.8"/>
  <circle cx="765" cy="168" r="16" fill="#8FB3E0"/>
  <text x="765" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#152238">3</text>
  <text x="792" y="176" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#B9D3F2">Run</text>
  <text x="750" y="211" font-family="system-ui, sans-serif" font-size="14" fill="#C4D3E6">execute the program</text>

  <rect x="308" y="268" width="180" height="58" rx="10" fill="#251F19" stroke="#94754D" stroke-width="1.3"/>
  <text x="398" y="303" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#F4C26B">Confined API</text>

  <rect x="516" y="268" width="180" height="58" rx="10" fill="#112923" stroke="#287F73" stroke-width="1.3"/>
  <text x="606" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#53DDC4">Trusted API</text>
  <text x="606" y="313" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#53DDC4">implementation</text>

  <path d="M190 170 H306" fill="none" stroke="#A3B9C9" stroke-width="2.3" marker-end="url(#arrow)"/>
  <text x="242" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#C1D2E0">Jo source</text>
  <path d="M308 204 H192" fill="none" stroke="#A3B9C9" stroke-width="2.3" marker-end="url(#arrow)"/>
  <text x="242" y="223" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#C1D2E0">compiler error</text>
  <path d="M488 185 H514" fill="none" stroke="#A3B9C9" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M696 185 H732" fill="none" stroke="#A3B9C9" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M398 268 V237" fill="none" stroke="#F4C26B" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M606 268 V237" fill="none" stroke="#3DD4BD" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <path d="M819 235 V401 H110 V247" fill="none" stroke="#A3B9C9" stroke-width="2.3" marker-end="url(#arrow)"/>
  <text x="464" y="389" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#C1D2E0">output or runtime error</text>
</svg>
