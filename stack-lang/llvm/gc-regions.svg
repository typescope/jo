<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #333; stroke-width: 1.2; }
      .static { fill: #eef1f5; stroke: #333; stroke-width: 1.2; }
      .full { fill: #d6e6fb; stroke: #2f5f9e; stroke-width: 1.2; }
      .partly { fill: #fde7c8; stroke: #b4711c; stroke-width: 1.2; }
      .empty { fill: #ececec; stroke: #888; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .obj { fill: #dcf1dc; stroke: #3c7d3c; stroke-width: 1.2; }
      .div { stroke: #333; stroke-width: 1; }
      .edge { stroke: #333; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
      .title { font-size: 17px; font-weight: bold; fill: #111; }
      .label { font-size: 12px; fill: #555; }
      .t { fill: #111; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #111; }
      .dot { fill: #333; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="960" fill="#ffffff"/>

  <!-- ============ Panel 1: structure ============ -->
  <text x="20" y="32" class="title">Regions, segments and objects</text>

  <!-- runtime state -->
  <text x="20" y="62" class="label">@runtime.state (static global, zeroed)</text>
  <rect x="20" y="70" width="570" height="40" class="static"/>
  <line x1="115" y1="70" x2="115" y2="110" class="div"/>
  <line x1="210" y1="70" x2="210" y2="110" class="div"/>
  <line x1="305" y1="70" x2="305" y2="110" class="div"/>
  <line x1="400" y1="70" x2="400" y2="110" class="div"/>
  <line x1="495" y1="70" x2="495" y2="110" class="div"/>
  <text x="34" y="95" class="t">region</text><circle cx="98" cy="90" r="3.5" class="dot"/>
  <text x="130" y="95" class="t">skipped</text>
  <text x="222" y="95" class="t">segPool</text><circle cx="290" cy="90" r="3.5" class="dot"/>
  <text x="313" y="95" class="t">segPoolSize</text>
  <text x="414" y="95" class="t">stackLow</text>
  <text x="509" y="95" class="t">stackTop</text>

  <!-- segment pool -->
  <path d="M290,110 L290,128 L640,128 L640,112" class="edge"/>
  <rect x="610" y="72" width="80" height="36" class="empty"/>
  <text x="623" y="95" class="t">free seg</text>
  <path d="M690,90 L718,90" class="edge"/>
  <rect x="720" y="72" width="80" height="36" class="empty"/>
  <text x="733" y="95" class="t">free seg</text>
  <path d="M800,90 L828,90" class="edge"/>
  <text x="834" y="95" class="t">… at most 64</text>
  <text x="610" y="62" class="label">segment pool</text>

  <!-- region descriptor -->
  <path d="M98,90 L98,168" class="edge"/>
  <text x="110" y="160" class="label">current region: descriptor (calloc, 32 bytes)</text>
  <rect x="20" y="170" width="440" height="40" class="box"/>
  <line x1="130" y1="170" x2="130" y2="210" class="div"/>
  <line x1="240" y1="170" x2="240" y2="210" class="div"/>
  <line x1="350" y1="170" x2="350" y2="210" class="div"/>
  <text x="34" y="195" class="t">parent</text><circle cx="112" cy="190" r="3.5" class="dot"/>
  <text x="146" y="195" class="t">depth i32</text>
  <text x="252" y="195" class="t">firstSeg</text><circle cx="332" cy="190" r="3.5" class="dot"/>
  <text x="362" y="195" class="t">lastSeg</text><circle cx="440" cy="190" r="3.5" class="dot"/>

  <!-- parent chain -->
  <path d="M112,210 L112,268" class="edge"/>
  <rect x="30" y="270" width="140" height="34" class="box"/>
  <text x="56" y="292" class="t">parent region</text>
  <text x="96" y="328" class="t">⋮</text>
  <rect x="30" y="340" width="140" height="48" class="static"/>
  <text x="48" y="360" class="t">runtime region</text>
  <text x="48" y="378" class="label">depth 0</text>

  <!-- segments -->
  <path d="M332,210 L332,268" class="edge"/>
  <path d="M440,210 L440,240 L860,240 L860,268" class="edge"/>

  <!-- first segment, detailed -->
  <text x="345" y="262" class="label">segment (512 bytes)</text>
  <rect x="230" y="270" width="200" height="150" class="full"/>
  <line x1="230" y1="300" x2="430" y2="300" class="div"/>
  <line x1="300" y1="270" x2="300" y2="300" class="div"/>
  <line x1="365" y1="270" x2="365" y2="300" class="div"/>
  <text x="240" y="290" class="t">next</text><circle cx="286" cy="285" r="3.5" class="dot"/>
  <text x="310" y="290" class="t">count</text>
  <text x="378" y="290" class="t">pad</text>
  <text x="242" y="324" class="t">object 0</text><circle cx="300" cy="320" r="3.5" class="dot"/>
  <line x1="230" y1="332" x2="430" y2="332" class="div"/>
  <text x="242" y="354" class="t">object 1</text><circle cx="300" cy="350" r="3.5" class="dot"/>
  <line x1="230" y1="362" x2="430" y2="362" class="div"/>
  <text x="242" y="386" class="t">… 62 entries</text>
  <text x="242" y="408" class="label">full</text>

  <!-- second segment -->
  <path d="M430,285 L478,285" class="edge"/>
  <rect x="480" y="270" width="150" height="150" class="full"/>
  <text x="494" y="292" class="t">next ●</text>
  <text x="494" y="320" class="t">62 entries</text>
  <text x="494" y="408" class="label">full</text>

  <!-- last segment -->
  <path d="M630,290 L668,290" class="edge"/>
  <text x="676" y="295" class="t">…</text>
  <path d="M690,290 L778,290" class="edge"/>
  <rect x="780" y="270" width="150" height="150" class="partly"/>
  <text x="794" y="292" class="t">next = null</text>
  <text x="794" y="320" class="t">k &lt; 62 entries</text>
  <text x="794" y="408" class="label">last, partly filled</text>

  <!-- heap object -->
  <path d="M300,320 L300,486" class="edge"/>
  <text x="20" y="480" class="label">heap object (calloc), 8-byte slots</text>
  <rect x="20" y="488" width="700" height="62" class="obj"/>
  <line x1="120" y1="488" x2="120" y2="550" class="div"/>
  <line x1="420" y1="488" x2="420" y2="550" class="div"/>
  <line x1="520" y1="488" x2="520" y2="550" class="div"/>
  <line x1="620" y1="488" x2="620" y2="550" class="div"/>
  <text x="34" y="524" class="t">cid i32</text>
  <text x="134" y="510" class="t">gc i32</text>
  <text x="134" y="528" class="mono">normal  [0 | phys:15 | req:16]</text>
  <text x="134" y="544" class="mono">on path [1 | cursor:31]</text>
  <text x="440" y="524" class="t">slot 1</text>
  <text x="540" y="524" class="t">slot 2</text>
  <text x="650" y="524" class="t">…</text>
  <text x="20" y="574" class="label">class instance: itable, fields …</text>
  <text x="230" y="574" class="label">closure: apply, underlying</text>
  <text x="420" y="574" class="label">array: size, elements …</text>
  <text x="590" y="574" class="label">buffer: bytes, where Addr fields point</text>
  <text x="20" y="594" class="label">Static objects (string literals, parameter keys, the runtime state) are in no segment: gc = 0, so phys = 0 and req = 0.</text>

  <!-- ============ Panel 2: close ============ -->
  <line x1="20" y1="620" x2="940" y2="620" stroke="#ccc" stroke-width="1"/>
  <text x="20" y="652" class="title">Closing region r</text>

  <!-- before -->
  <text x="20" y="684" class="t" font-weight="bold">before</text>
  <text x="40" y="716" class="t">parent</text>
  <rect x="130" y="696" width="110" height="32" class="full"/><text x="160" y="717" class="t">A: 62</text>
  <path d="M240,712 L268,712" class="edge"/>
  <rect x="270" y="696" width="110" height="32" class="partly"/><text x="300" y="717" class="t">B: 40</text>
  <text x="390" y="717" class="label">◄ last</text>

  <text x="40" y="764" class="t">r</text>
  <rect x="130" y="744" width="110" height="32" class="full"/><text x="157" y="765" class="t">S1: 62</text>
  <path d="M240,760 L268,760" class="edge"/>
  <rect x="270" y="744" width="110" height="32" class="partly"/><text x="297" y="765" class="t">S2: 30</text>
  <path d="M380,760 L408,760" class="edge"/>
  <rect x="410" y="744" width="110" height="32" class="empty"/><text x="440" y="765" class="t">S3: 0</text>
  <text x="130" y="796" class="label">survivors, packed at the front</text>
  <text x="410" y="796" class="label">emptied by the sweep</text>

  <!-- after -->
  <text x="560" y="684" class="t" font-weight="bold">after</text>
  <text x="560" y="716" class="t">parent</text>
  <rect x="560" y="726" width="80" height="32" class="full"/><text x="574" y="747" class="t">S1: 62</text>
  <path d="M640,742 L652,742" class="edge"/>
  <rect x="654" y="726" width="80" height="32" class="full"/><text x="672" y="747" class="t">A: 62</text>
  <path d="M734,742 L746,742" class="edge"/>
  <rect x="748" y="726" width="80" height="32" class="full"/><text x="766" y="747" class="t">B: 62</text>
  <path d="M828,742 L840,742" class="edge"/>
  <rect x="842" y="726" width="80" height="32" class="partly"/><text x="861" y="747" class="t">S2: 8</text>
  <text x="756" y="776" class="label">+22 from S2</text>
  <text x="852" y="776" class="label">◄ last</text>

  <text x="560" y="812" class="t">pool</text>
  <rect x="610" y="794" width="80" height="28" class="empty"/><text x="637" y="813" class="t">S3</text>
  <path d="M690,808 L718,808" class="edge"/>
  <text x="724" y="813" class="t">…</text>
  <text x="560" y="848" class="t">r: descriptor freed</text>

  <text x="20" y="880" class="label">The full survivor segments go to the front of the parent's list. The partly filled one tops up the parent's last segment,</text>
  <text x="20" y="898" class="label">and what is left of it becomes the new last segment. Empty segments return to the pool. The parent again has only one partly</text>
  <text x="20" y="916" class="label">filled segment, its last one. If B had room for all of S2, S2 would go to the pool and B would stay last.</text>

  <!-- legend -->
  <rect x="20" y="932" width="14" height="14" class="full"/><text x="40" y="944" class="label">full segment</text>
  <rect x="140" y="932" width="14" height="14" class="partly"/><text x="160" y="944" class="label">partly filled</text>
  <rect x="270" y="932" width="14" height="14" class="empty"/><text x="290" y="944" class="label">empty / pooled</text>
  <rect x="400" y="932" width="14" height="14" class="obj"/><text x="420" y="944" class="label">heap object</text>
  <rect x="520" y="932" width="14" height="14" class="static"/><text x="540" y="944" class="label">static</text>
</svg>
