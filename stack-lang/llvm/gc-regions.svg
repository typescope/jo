<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1030" viewBox="0 0 960 1030" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #333; stroke-width: 1.2; }
      .static { fill: #eef1f5; stroke: #333; stroke-width: 1.2; }
      .current { fill: #fff6d6; stroke: #8a6d00; stroke-width: 1.4; }
      .merged { fill: #e9e2f5; stroke: #5d4a8a; stroke-width: 1.2; }
      .full { fill: #d6e6fb; stroke: #2f5f9e; stroke-width: 1.2; }
      .partly { fill: #fde7c8; stroke: #b4711c; stroke-width: 1.2; }
      .empty { fill: #ececec; stroke: #888; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .obj { fill: #dcf1dc; stroke: #3c7d3c; stroke-width: 1.2; }
      .div { stroke: #333; stroke-width: 1; }
      .edge { stroke: #333; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
      .expand { stroke: #333; stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
      .brace { stroke: #5d4a8a; stroke-width: 1.2; fill: none; }
      .title { font-size: 17px; font-weight: bold; fill: #111; }
      .label { font-size: 12px; fill: #555; }
      .t { fill: #111; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #111; }
      .dot { fill: #333; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="1030" fill="#ffffff"/>

  <!-- ============ Panel 1: structure ============ -->
  <text x="20" y="32" class="title">Regions, segments and objects</text>

  <!-- runtime state -->
  <text x="20" y="62" class="label">@runtime.state (static global, zeroed)</text>
  <rect x="20" y="70" width="920" height="40" class="static"/>
  <line x1="135" y1="70" x2="135" y2="110" class="div"/>
  <line x1="250" y1="70" x2="250" y2="110" class="div"/>
  <line x1="365" y1="70" x2="365" y2="110" class="div"/>
  <line x1="480" y1="70" x2="480" y2="110" class="div"/>
  <line x1="595" y1="70" x2="595" y2="110" class="div"/>
  <line x1="710" y1="70" x2="710" y2="110" class="div"/>
  <line x1="825" y1="70" x2="825" y2="110" class="div"/>
  <text x="32" y="95" class="t">regions</text><circle cx="118" cy="90" r="3.5" class="dot"/>
  <text x="147" y="95" class="t">region</text><circle cx="233" cy="90" r="3.5" class="dot"/>
  <text x="262" y="95" class="t">level = num</text>
  <text x="377" y="95" class="t">skipped</text>
  <text x="492" y="95" class="t">segPool</text><circle cx="578" cy="90" r="3.5" class="dot"/>
  <text x="607" y="95" class="t">segPoolSize</text>
  <text x="722" y="95" class="t">stackLow</text>
  <text x="837" y="95" class="t">stackTop</text>

  <!-- segment pool -->
  <text x="700" y="126" class="label">segment pool</text>
  <path d="M578,110 L578,146 L698,146" class="edge"/>
  <rect x="700" y="132" width="80" height="28" class="empty"/>
  <text x="713" y="151" class="t">free seg</text>
  <path d="M780,146 L798,146" class="edge"/>
  <rect x="800" y="132" width="80" height="28" class="empty"/>
  <text x="813" y="151" class="t">free seg</text>
  <text x="886" y="151" class="t">… 64</text>

  <!-- descriptor array -->
  <path d="M118,110 L118,178" class="edge"/>
  <path d="M233,110 L233,128 L500,128 L500,178" class="edge"/>
  <rect x="20" y="180" width="110" height="34" class="static"/><text x="34" y="202" class="t">0: runtime</text>
  <rect x="135" y="180" width="60" height="34" class="box"/><text x="160" y="202" class="t">1</text>
  <rect x="200" y="180" width="40" height="34" class="box"/><text x="213" y="202" class="t">…</text>
  <rect x="245" y="180" width="60" height="34" class="box"/><text x="270" y="202" class="t">p</text>
  <rect x="310" y="180" width="70" height="34" class="merged"/><text x="330" y="202" class="t">p+1</text>
  <rect x="385" y="180" width="70" height="34" class="merged"/><text x="405" y="202" class="t">p+2</text>
  <rect x="460" y="180" width="80" height="34" class="current"/><text x="478" y="202" class="t">num</text>
  <rect x="545" y="180" width="200" height="34" class="empty"/><text x="560" y="202" class="t">unused levels … 32767</text>
  <text x="760" y="194" class="label">regions: one 32-byte</text>
  <text x="760" y="210" class="label">descriptor per level</text>

  <!-- levels of the parent -->
  <path d="M248,222 L248,228 L452,228 L452,222" class="brace"/>
  <text x="250" y="246" class="label">levels of the parent p: p.hi = p+2,</text>
  <text x="250" y="262" class="label">the regions merged into it</text>

  <!-- current descriptor, expanded -->
  <path d="M500,214 L500,276" class="expand"/>
  <text x="510" y="262" class="label">current region: descriptor (32 bytes)</text>
  <rect x="20" y="278" width="700" height="40" class="current"/>
  <line x1="136" y1="278" x2="136" y2="318" class="div"/>
  <line x1="252" y1="278" x2="252" y2="318" class="div"/>
  <line x1="368" y1="278" x2="368" y2="318" class="div"/>
  <line x1="484" y1="278" x2="484" y2="318" class="div"/>
  <line x1="602" y1="278" x2="602" y2="318" class="div"/>
  <text x="32" y="303" class="t">parent = p</text>
  <text x="148" y="303" class="t">hi = num</text>
  <text x="264" y="303" class="t">min</text>
  <text x="380" y="303" class="t">segs</text>
  <text x="496" y="303" class="t">firstSeg</text><circle cx="588" cy="298" r="3.5" class="dot"/>
  <text x="614" y="303" class="t">lastSeg</text><circle cx="705" cy="298" r="3.5" class="dot"/>

  <!-- segments -->
  <path d="M588,318 L588,338 L330,338 L330,366" class="edge"/>
  <path d="M705,318 L705,334 L855,334 L855,366" class="edge"/>

  <!-- first segment, detailed -->
  <text x="340" y="360" class="label">segment (512 bytes)</text>
  <rect x="230" y="368" width="200" height="160" class="partly"/>
  <line x1="230" y1="398" x2="430" y2="398" class="div"/>
  <line x1="230" y1="426" x2="430" y2="426" class="div"/>
  <text x="240" y="388" class="t">next</text><circle cx="286" cy="383" r="3.5" class="dot"/>
  <text x="240" y="417" class="t">count</text>
  <text x="242" y="448" class="t">object 0</text><circle cx="300" cy="444" r="3.5" class="dot"/>
  <line x1="230" y1="456" x2="430" y2="456" class="div"/>
  <text x="242" y="478" class="t">… up to 62</text>
  <text x="242" y="516" class="label">first, partly filled</text>

  <!-- second segment -->
  <path d="M430,383 L478,383" class="edge"/>
  <rect x="480" y="368" width="150" height="160" class="full"/>
  <text x="494" y="390" class="t">next ●</text>
  <text x="494" y="418" class="t">62 objects</text>
  <text x="494" y="516" class="label">full</text>

  <!-- last segment -->
  <path d="M630,388 L668,388" class="edge"/>
  <text x="676" y="393" class="t">…</text>
  <path d="M690,388 L778,388" class="edge"/>
  <rect x="780" y="368" width="150" height="160" class="full"/>
  <text x="794" y="390" class="t">next = null</text>
  <text x="794" y="418" class="t">62 objects</text>
  <text x="794" y="516" class="label">last, full</text>

  <!-- parent levels are not pointers -->
  <text x="20" y="352" class="label">parent is a level,</text>
  <text x="20" y="368" class="label">not a pointer</text>

  <!-- heap object -->
  <path d="M300,444 L300,584" class="edge"/>
  <text x="20" y="578" class="label">heap object (calloc), 8-byte slots</text>
  <rect x="20" y="586" width="700" height="62" class="obj"/>
  <line x1="120" y1="586" x2="120" y2="648" class="div"/>
  <line x1="420" y1="586" x2="420" y2="648" class="div"/>
  <line x1="520" y1="586" x2="520" y2="648" class="div"/>
  <line x1="620" y1="586" x2="620" y2="648" class="div"/>
  <text x="34" y="622" class="t">cid i32</text>
  <text x="134" y="608" class="t">gc i32</text>
  <text x="134" y="626" class="mono">normal  [0 | phys:15 | req:16]</text>
  <text x="134" y="642" class="mono">on path [1 | cursor:31]</text>
  <text x="440" y="622" class="t">slot 1</text>
  <text x="540" y="622" class="t">slot 2</text>
  <text x="650" y="622" class="t">…</text>
  <text x="20" y="672" class="label">class instance: itable, fields …</text>
  <text x="230" y="672" class="label">closure: apply, underlying</text>
  <text x="420" y="672" class="label">array: size, elements …</text>
  <text x="590" y="672" class="label">buffer: bytes, where Addr fields point</text>
  <text x="20" y="692" class="label">phys and req are levels. Static objects (string literals, parameter keys, the runtime state) are in no segment: gc = 0, so phys = req = 0.</text>

  <!-- ============ Panel 2: close ============ -->
  <line x1="20" y1="716" x2="940" y2="716" stroke="#ccc" stroke-width="1"/>
  <text x="20" y="748" class="title">Closing region r</text>

  <text x="20" y="776" class="t">m = the least min over the levels num … hi of r</text>
  <text x="20" y="798" class="t">• m ≥ num, nothing escapes: free all objects</text>
  <text x="20" y="818" class="t">• otherwise, if parent.segs + r.segs ≤ 8: merge, give all segments, parent.hi = max(parent.hi, r.hi)</text>
  <text x="20" y="838" class="t">• otherwise collect: trace, free the dead, give the survivors</text>
  <text x="20" y="858" class="t">Both merge and collect pass up parent.min = min(parent.min, m).</text>

  <!-- before -->
  <text x="20" y="892" class="t" font-weight="bold">giving segments: before</text>
  <text x="20" y="922" class="t">parent</text>
  <rect x="80" y="904" width="80" height="30" class="partly"/><text x="96" y="924" class="t">P0: 40</text>
  <path d="M160,919 L178,919" class="edge"/>
  <rect x="180" y="904" width="80" height="30" class="full"/><text x="198" y="924" class="t">A: 62</text>

  <text x="20" y="966" class="t">given</text>
  <rect x="80" y="948" width="80" height="30" class="partly"/><text x="98" y="968" class="t">W: 30</text>
  <path d="M160,963 L178,963" class="edge"/>
  <rect x="180" y="948" width="80" height="30" class="full"/><text x="196" y="968" class="t">S1: 62</text>

  <!-- after -->
  <text x="420" y="892" class="t" font-weight="bold">after</text>
  <text x="420" y="922" class="t">parent</text>
  <rect x="480" y="904" width="80" height="30" class="partly"/><text x="502" y="924" class="t">W: 8</text>
  <path d="M560,919 L578,919" class="edge"/>
  <rect x="580" y="904" width="80" height="30" class="full"/><text x="596" y="924" class="t">S1: 62</text>
  <path d="M660,919 L678,919" class="edge"/>
  <rect x="680" y="904" width="80" height="30" class="full"/><text x="696" y="924" class="t">P0: 62</text>
  <path d="M760,919 L778,919" class="edge"/>
  <rect x="780" y="904" width="80" height="30" class="full"/><text x="798" y="924" class="t">A: 62</text>
  <text x="682" y="952" class="label">+22 from W</text>

  <text x="20" y="1000" class="label">W tops up the parent's first segment. Here some objects are left, so W becomes the first segment. If W empties, it goes to the pool</text>
  <text x="20" y="1018" class="label">and S1 is spliced in after P0. Either way only the first segment is partly filled.</text>

  <!-- legend -->
  <rect x="480" y="878" width="14" height="14" class="partly"/><text x="500" y="890" class="label">partly filled</text>
  <rect x="585" y="878" width="14" height="14" class="full"/><text x="605" y="890" class="label">full</text>
  <rect x="640" y="878" width="14" height="14" class="empty"/><text x="660" y="890" class="label">pooled / unused</text>
  <rect x="760" y="878" width="14" height="14" class="merged"/><text x="780" y="890" class="label">merged level</text>
  <rect x="870" y="878" width="14" height="14" class="current"/><text x="890" y="890" class="label">current</text>
</svg>
